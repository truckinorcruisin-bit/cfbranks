name: Update rankings data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["index.html", "picks.json", "scripts/**", ".github/workflows/**"]
  schedule:
    - cron: "0 11 * * *"     # every morning
    - cron: "0 16-23 * * 6"  # Saturday afternoon and evening (UTC)
    - cron: "0 0-8 * * 0"    # late Saturday games (early Sunday UTC)
    - cron: "30 19 * * 0"    # after the AP poll is released (about 2 p.m. ET Sunday)
    - cron: "30 22 * * 0"    # second try in case the poll posts late

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Job 1: refresh data.json, commit it, and package the site.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest results and AP poll
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          SEASON: ${{ vars.SEASON }}
        run: python scripts/build_data.py

      - name: Commit data.json if it changed
        run: |
          if git diff --quiet -- data.json; then
            echo "No data changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "Update data $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          fi

      - name: Stage site
        run: |
          mkdir -p _site && cp index.html data.json _site/
          if [ -f picks.json ]; then cp picks.json _site/; fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Job 2: publish. Running this as its own job (on a fresh runner, after the
  # upload has fully finished) avoids the "No artifacts named github-pages"
  # race, and the retries below cover the occasional transient failure.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.attempt3.outputs.page_url || steps.attempt2.outputs.page_url || steps.attempt1.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: attempt1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait, then retry
        if: steps.attempt1.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry 1)
        id: attempt2
        if: steps.attempt1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait longer, then retry
        if: steps.attempt2.outcome == 'failure'
        run: sleep 90

      - name: Deploy to GitHub Pages (retry 2)
        id: attempt3
        if: steps.attempt2.outcome == 'failure'
        uses: actions/deploy-pages@v4
